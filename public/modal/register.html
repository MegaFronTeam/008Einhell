
<div class="modal-win modal-win modal-win--auth">
	<form class="modal-win__form">
		<div class="modal-win__title">Регистрация
		</div>
		<input class="form-control" type="email" name="email" placeholder="E-mail" inputmode="email"/>
		<input class="form-control" type="password" name="password" placeholder="Пароль"/>
		<input class="form-control is-invalid" type="password" name="password2" placeholder="Повторите пароль"/>

		</div>

</div>
